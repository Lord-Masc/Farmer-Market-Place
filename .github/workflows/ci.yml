name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci (not install) for reproducible lockfile builds; --ignore-scripts
      # blocks install-script supply-chain attacks (Sonar S6505/S8543).
      # Verified locally: both the frontend build and the backend tests pass
      # with --ignore-scripts (no postinstall/preinstall scripts exist).
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend

  # Secret scan (Stage 0, unit 7): blocks .env files and key patterns from
  # landing in the tree. The gitleaks CLI binary is used directly (pinned
  # release, no license needed) instead of gitleaks-action v2, which requires
  # a paid license key.
  # --no-git is deliberate: git history still holds the dead compromised
  # keys from 2026-11-08 (history purge was skipped on Rishabh's word after
  # he rotated them), so a history scan would fail forever on old commits.
  # This job guards NEW content only — the current checkout.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --source . --redact --exit-code 1
